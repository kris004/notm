[package]
name = "notm-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dev-dependencies]
anyhow.workspace = true
notm-mail = { path = "crates/notm-mail" }
notm-notmuch = { path = "crates/notm-notmuch" }
notm-test-support = { path = "crates/notm-test-support" }
serde_json.workspace = true
tokio.workspace = true
tempfile.workspace = true

[workspace]
resolver = "2"
members = [
  "crates/notm-app",
  "crates/notm-notmuch",
  "crates/notm-mail",
  "crates/notm-ui",
  "crates/notm-test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/kris004/notm"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6.0"
email_address = "0.2"
html2text = "0.16.5"
ammonia = "4.1"
libc = "0.2"
mailparse = "0.16"
once_cell = "1.21"
parking_lot = "0.12"
quoted_printable = "0.5"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.45", features = ["process", "rt-multi-thread", "macros", "time", "io-util", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.17", features = ["v4", "serde"] }
walkdir = "2.5"
webkit6 = "0.6.1"
