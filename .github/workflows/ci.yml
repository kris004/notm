name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: Format, lint, test, and GTK smoke
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, notm-private-runner]
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native dependencies on a GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            clang \
            dbus-daemon \
            libclang-dev \
            libgtk-4-dev \
            libgtksourceview-5-dev \
            libnotmuch-dev \
            libwebkitgtk-6.0-dev \
            pkg-config \
            weston \
            xauth \
            xvfb

          packages=(
            build-essential
            clang
            dbus-daemon
            libclang-dev
            libgtk-4-dev
            libgtksourceview-5-dev
            libnotmuch-dev
            libwebkitgtk-6.0-dev
            pkg-config
            weston
            xauth
            xvfb
          )
          dpkg-query --show --showformat='${binary:Package}\t${Version}\n' "${packages[@]}"
          for executable in Xvfb cc clang dbus-run-session pkg-config weston xauth xvfb-run; do
            command -v "$executable"
          done
          pkg-config --modversion gtk4 gtksourceview-5 webkitgtk-6.0
          test -r /usr/include/notmuch.h

      - name: Verify preinstalled self-hosted dependencies
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euxo pipefail
          for executable in \
            Xvfb cargo cargo-clippy cc clang dbus-run-session pkg-config rustc \
            rustfmt rustup weston xauth xvfb-run; do
            command -v "$executable"
          done
          pkg-config --modversion gtk4 gtksourceview-5 webkitgtk-6.0
          test -r /usr/include/notmuch.h
          temporary_executable="$(mktemp)"
          trap 'rm -f "$temporary_executable"' EXIT
          printf '#!/usr/bin/bash\nexit 0\n' >"$temporary_executable"
          chmod 0700 "$temporary_executable"
          "$temporary_executable"
          rm "$temporary_executable"
          trap - EXIT

      - name: Select the stable Rust toolchain
        if: runner.environment == 'github-hosted'
        shell: bash
        run: |
          set -euxo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
          rustc --version --verbose
          cargo --version --verbose

      - name: Report the pinned self-hosted Rust toolchain
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euxo pipefail
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version --verbose

      - name: Cache Cargo data and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --all-targets --all-features

      - name: Run fixture smoke
        run: cargo run -p notm-app -- fixture-smoke

      - name: Probe a disposable send transport
        shell: bash
        run: |
          set -euxo pipefail
          probe_config="${RUNNER_TEMP}/notm-probe-send.toml"
          cat >"$probe_config" <<'EOF'
          [send]
          enabled = true
          transport = "external"
          command = "/usr/bin/true"
          mode = "stdin_rfc5322"
          EOF
          cargo run -p notm-app -- --config "$probe_config" probe-send

      - name: Run the complete Wayland GTK smoke with a required display
        # GitHub-hosted runners block the user namespace required by WebKitGTK's
        # bubblewrap sandbox. This exception is scoped to disposable fixture UI tests.
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
        shell: bash
        run: |
          set -euxo pipefail
          tests/run_with_headless_weston.sh \
            dbus-run-session -- \
            cargo test -p notm-app --test desktop_ui_smoke -- \
              --nocapture --test-threads=1

      - name: Run a WebKit GTK smoke on X11
        # Keep a narrow second-backend check without doubling the complete UI suite.
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
        shell: bash
        run: |
          set -euxo pipefail
          env -u DISPLAY -u WAYLAND_DISPLAY -u SWAYSOCK \
            GDK_BACKEND=x11 \
            NOTM_GUI_TEST_DISPLAY=provided \
            NOTM_REQUIRE_GTK_DISPLAY=1 \
            dbus-run-session -- \
            xvfb-run -a \
            cargo test -p notm-app --test desktop_ui_smoke \
              fixture_html_link_hints_label_visible_links_and_cancel -- \
              --exact --nocapture --test-threads=1
