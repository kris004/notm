name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  ACTIONLINT_VERSION: 1.7.12
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: Format, lint, test, and GTK smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record committed Cargo.lock
        id: cargo-lock
        shell: bash
        run: |
          set -euo pipefail
          printf 'sha256=%s\n' "$(sha256sum Cargo.lock | cut -d ' ' -f 1)" \
            >>"$GITHUB_OUTPUT"

      - name: Install native dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            appstream \
            build-essential \
            clang \
            curl \
            dbus-daemon \
            desktop-file-utils \
            gnupg \
            libclang-dev \
            libgtk-4-dev \
            libgtksourceview-5-dev \
            libnotmuch-dev \
            libwebkitgtk-6.0-dev \
            mandoc \
            pkg-config \
            python3 \
            shellcheck \
            weston \
            xauth \
            xvfb

          packages=(
            appstream
            build-essential
            clang
            curl
            dbus-daemon
            desktop-file-utils
            gnupg
            libclang-dev
            libgtk-4-dev
            libgtksourceview-5-dev
            libnotmuch-dev
            libwebkitgtk-6.0-dev
            mandoc
            pkg-config
            python3
            shellcheck
            weston
            xauth
            xvfb
          )
          dpkg-query --show --showformat='${binary:Package}\t${Version}\n' "${packages[@]}"
          for executable in Xvfb cc clang curl dbus-run-session gpg mandoc \
            pkg-config python3 shellcheck weston xauth xvfb-run
          do
            command -v "$executable"
          done
          pkg-config --modversion gtk4 gtksourceview-5 webkitgtk-6.0
          test -r /usr/include/notmuch.h

      - name: Validate release policy and metadata
        run: make check-policy

      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euxo pipefail
          test "$(uname -m)" = x86_64
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$archive" "$url"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/$archive" |
            sha256sum --check
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -version
          printf '%s\n' "$RUNNER_TEMP/actionlint" >>"$GITHUB_PATH"

      - name: Select the stable Rust toolchain
        shell: bash
        run: |
          set -euxo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
          rustc --version --verbose
          cargo --version --verbose

      - name: Cache Cargo data and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Run fixture smoke
        run: cargo run --locked -p notm-app -- fixture-smoke

      - name: Probe a disposable send transport
        shell: bash
        run: |
          set -euxo pipefail
          probe_config="${RUNNER_TEMP}/notm-probe-send.toml"
          cat >"$probe_config" <<'EOF'
          [send]
          enabled = true
          transport = "external"
          command = "/usr/bin/true"
          mode = "stdin_rfc5322"
          EOF
          cargo run --locked -p notm-app -- --config "$probe_config" probe-send

      - name: Validate workflows, shell, man pages, and desktop metadata
        shell: bash
        run: |
          set -euxo pipefail
          actionlint
          shellcheck \
            packaging/*.sh \
            packaging/arm64/*.sh \
            packaging/flatpak/*.sh \
            tests/*.sh
          mandoc -Tlint \
            docs/man/notm.1 \
            docs/man/notm-config.5 \
            docs/man/notm-test-harness.7 \
            docs/man/notm-automation.7
          desktop-file-validate packaging/io.github.kris004.notm.desktop
          appstreamcli validate --strict --pedantic --no-net \
            packaging/io.github.kris004.notm.metainfo.xml

      - name: Validate install and release packaging
        run: |
          make check-packaging
          ./tests/arm64_release_smoke.sh
          ./tests/flatpak_builder_wrapper_smoke.sh
          python3 -B tests/distribution_e2e_socket_smoke.py

      - name: Build and test a clean source archive
        run: ./tests/source_archive_smoke.sh

      - name: Run the complete Wayland GTK smoke with a required display
        # GitHub-hosted runners block the user namespace required by WebKitGTK's
        # bubblewrap sandbox. This exception is scoped to disposable fixture UI tests.
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
        shell: bash
        run: |
          set -euxo pipefail
          tests/run_with_headless_weston.sh \
            dbus-run-session -- \
            cargo test --locked -p notm-app --test desktop_ui_smoke -- \
              --nocapture --test-threads=1

      - name: Run a WebKit GTK smoke on X11
        # Keep a narrow second-backend check without doubling the complete UI suite.
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
        shell: bash
        run: |
          set -euxo pipefail
          env -u DISPLAY -u WAYLAND_DISPLAY -u SWAYSOCK \
            GDK_BACKEND=x11 \
            NOTM_GUI_TEST_DISPLAY=provided \
            NOTM_REQUIRE_GTK_DISPLAY=1 \
            dbus-run-session -- \
            xvfb-run -a \
            cargo test --locked -p notm-app --test desktop_ui_smoke \
              fixture_html_link_hints_label_visible_links_and_cancel -- \
              --exact --nocapture --test-threads=1

      - name: Verify Cargo.lock is unchanged
        if: always()
        env:
          EXPECTED_SHA256: ${{ steps.cargo-lock.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          packaging/verify-cargo-lock.sh Cargo.lock "$EXPECTED_SHA256"
