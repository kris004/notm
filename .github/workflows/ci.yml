name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: Format, lint, test, and GTK smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install native dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            clang \
            dbus-daemon \
            libclang-dev \
            libgtk-4-dev \
            libgtksourceview-5-dev \
            libnotmuch-dev \
            libwebkitgtk-6.0-dev \
            pkg-config \
            xauth \
            xvfb

          packages=(
            build-essential
            clang
            dbus-daemon
            libclang-dev
            libgtk-4-dev
            libgtksourceview-5-dev
            libnotmuch-dev
            libwebkitgtk-6.0-dev
            pkg-config
            xauth
            xvfb
          )
          dpkg-query --show --showformat='${binary:Package}\t${Version}\n' "${packages[@]}"
          for executable in cc clang dbus-run-session pkg-config xauth xvfb-run; do
            command -v "$executable"
          done
          pkg-config --modversion gtk4 gtksourceview-5 webkitgtk-6.0
          test -r /usr/include/notmuch.h

      - name: Select the stable Rust toolchain
        shell: bash
        run: |
          set -euxo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
          rustc --version --verbose
          cargo --version --verbose

      - name: Cache Cargo data and build outputs
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --all-targets --all-features

      - name: Run fixture smoke
        run: cargo run -p notm-app -- fixture-smoke

      - name: Probe a disposable send transport
        shell: bash
        run: |
          set -euxo pipefail
          probe_config="${RUNNER_TEMP}/notm-probe-send.toml"
          cat >"$probe_config" <<'EOF'
          [send]
          enabled = true
          transport = "external"
          command = "/usr/bin/true"
          mode = "stdin_rfc5322"
          EOF
          cargo run -p notm-app -- --config "$probe_config" probe-send

      - name: Run the complete GTK smoke with a required display
        # GitHub-hosted runners block the user namespace required by WebKitGTK's
        # bubblewrap sandbox. This exception is scoped to disposable fixture UI tests.
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
        shell: bash
        run: |
          set -euxo pipefail
          env -u WAYLAND_DISPLAY -u SWAYSOCK \
            GDK_BACKEND=x11 \
            NOTM_GUI_TEST_DISPLAY=provided \
            NOTM_REQUIRE_GTK_DISPLAY=1 \
            dbus-run-session -- \
            xvfb-run -a \
            cargo test -p notm-app --test desktop_ui_smoke -- \
              --nocapture --test-threads=1
