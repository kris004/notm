name: Release Linux binary

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RELEASE_SIGNING_FINGERPRINT: BE592562E6131A53F4BADE4A046928E9A919BAF9

jobs:
  build:
    name: Build x86_64 release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      release-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      source-commit: ${{ steps.release.outputs.source-commit }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Record committed Cargo.lock
        id: cargo-lock
        shell: bash
        run: |
          set -euo pipefail
          printf 'sha256=%s\n' "$(sha256sum Cargo.lock | cut -d ' ' -f 1)" \
            >>"$GITHUB_OUTPUT"

      - name: Validate release source and authorization
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          packaging/check-release-key-expiry.sh \
            docs/release-signing-key.asc \
            "$RELEASE_SIGNING_FINGERPRINT"
          package_version="$(
            packaging/verify-release-metadata.py --print-version .
          )"
          [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          source_commit="$(git rev-parse HEAD)"

          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$GITHUB_REF_TYPE" = tag
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
            test "${GITHUB_REF_NAME#v}" = "$package_version"

            ref_api="repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}"
            if [[ $(gh api "$ref_api" --jq '.object.type') != tag ]]; then
              echo 'release tag must be an annotated tag object' >&2
              exit 1
            fi

            tag_sha="$(gh api "$ref_api" --jq '.object.sha')"
            tag_api="repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}"
            tag_json="$(gh api "$tag_api")"
            jq -e \
              --arg name "$GITHUB_REF_NAME" \
              --arg commit "$source_commit" \
              '.tag == $name and
               .object.type == "commit" and
               .object.sha == $commit and
               .verification.verified == true and
               .verification.reason == "valid"' \
              <<<"$tag_json" >/dev/null || {
                jq '{tag, object, verification}' <<<"$tag_json" >&2
                echo 'release tag must be direct and GitHub-verified' >&2
                exit 1
              }

            packaging/verify-release-tag.sh \
              . \
              "$GITHUB_REF_NAME" \
              docs/release-signing-key.asc \
              "$RELEASE_SIGNING_FINGERPRINT"

            default_branch="$(
              gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch'
            )"
            comparison="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/compare/${source_commit}...${default_branch}" \
                --jq '.status'
            )"
            if [[ "$comparison" != ahead && "$comparison" != identical ]]; then
              echo 'release commit is not reachable from the default branch' >&2
              exit 1
            fi

            check_runs="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/commits/${source_commit}/check-runs?per_page=100&filter=latest"
            )"
            required_checks=(
              'Format, lint, test, and GTK smoke'
              'Analyze Rust'
            )
            for required_check in "${required_checks[@]}"; do
              jq -e --arg name "$required_check" '
                [.check_runs[] | select(.name == $name)] as $runs |
                ($runs | length) > 0 and
                all($runs[];
                  .status == "completed" and .conclusion == "success")
              ' <<<"$check_runs" >/dev/null || {
                echo "required check is not successful: $required_check" >&2
                exit 1
              }
            done

            if gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo 'release already exists; refusing to replace it' >&2
              exit 1
            fi
          else
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF_TYPE" = branch
          fi

          printf 'source-commit=%s\n' "$source_commit" >>"$GITHUB_OUTPUT"
          printf 'version=%s\n' "$package_version" >>"$GITHUB_OUTPUT"

      - name: Install native dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            appstream \
            build-essential \
            clang \
            dbus-daemon \
            desktop-file-utils \
            file \
            gnupg \
            libclang-dev \
            libgtk-4-dev \
            libgtksourceview-5-dev \
            libnotmuch-dev \
            libwebkitgtk-6.0-dev \
            pkg-config

      - name: Select the stable Rust toolchain
        shell: bash
        run: |
          set -euxo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose

      - name: Test release source
        shell: bash
        run: |
          set -euxo pipefail
          cargo test --locked --workspace --all-targets --all-features
          cargo run --locked -p notm-app -- fixture-smoke
          make check-packaging

      - name: Build release binary
        run: cargo build --release --locked -p notm-app

      - name: Inspect and package release assets
        env:
          SOURCE_COMMIT: ${{ steps.release.outputs.source-commit }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euxo pipefail
          binary=target/release/notm
          test "$(uname -m)" = x86_64
          test "$("$binary" --version)" = "notm $VERSION"
          file "$binary" | grep -F 'ELF 64-bit LSB pie executable, x86-64'
          mkdir -p dist
          ldd "$binary" | tee dist/ldd.txt
          if grep -F 'not found' dist/ldd.txt; then
            echo 'release binary has an unresolved shared-library dependency' >&2
            exit 1
          fi
          strip --strip-unneeded "$binary"

          {
            printf 'Version: %s\n' "$VERSION"
            printf 'Source tag: v%s\n' "$VERSION"
            printf 'Source commit: %s\n' "$SOURCE_COMMIT"
            printf 'Target: x86_64-unknown-linux-gnu\n'
            printf 'Build image: ubuntu-24.04\n'
            rustc --version
            cargo --version
            printf '\nNative build packages:\n'
            dpkg-query --show --showformat='${binary:Package}\t${Version}\n' \
              libgtk-4-dev \
              libgtksourceview-5-dev \
              libnotmuch-dev \
              libwebkitgtk-6.0-dev
            printf '\nDirect ELF dependencies:\n'
            readelf -d "$binary" |
              sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' | sort
          } >dist/BUILD-INFO.txt

          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$SOURCE_COMMIT")" \
            SOURCE_REF="$SOURCE_COMMIT" \
            packaging/build-linux-release.sh \
              . \
              "$VERSION" \
              x86_64-unknown-linux-gnu \
              "$binary" \
              dist/BUILD-INFO.txt \
              dist

          rm dist/BUILD-INFO.txt dist/ldd.txt
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 3
          packaging/verify-linux-release.sh \
            dist \
            "$VERSION" \
            x86_64-unknown-linux-gnu \
            "$SOURCE_COMMIT"

          mkdir -p verify/binary verify/source verify/tag
          tar -xzf \
            "dist/notm-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            -C verify/binary
          tar -xzf "dist/notm-v${VERSION}-src.tar.gz" -C verify/source
          git archive \
            --format=tar \
            --prefix="notm-${VERSION}/" \
            "$SOURCE_COMMIT" |
            tar -xf - -C verify/tag
          diff -qr verify/source verify/tag
          verify/binary/notm-v"${VERSION}"-x86_64-unknown-linux-gnu/bin/notm \
            --version

          (
            cd "verify/source/notm-${VERSION}"
            test ! -e .git
            CARGO_TARGET_DIR="${RUNNER_TEMP}/notm-source-archive-target"
            export CARGO_TARGET_DIR
            cargo build --release --locked -p notm-app
            cargo test --locked --workspace --all-targets --all-features
            cargo run --locked -p notm-app -- fixture-smoke
            make check-packaging
          )

      - name: Upload release assets
        id: upload
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets-x86_64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Verify Cargo.lock is unchanged
        if: always()
        env:
          EXPECTED_SHA256: ${{ steps.cargo-lock.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          packaging/verify-cargo-lock.sh Cargo.lock "$EXPECTED_SHA256"

  arm64:
    name: Build and compare native ARM64 release assets
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/release-linux-arm64.yml
    with:
      source_ref: ${{ needs.build.outputs.source-commit }}

  aggregate:
    name: Aggregate canonical release assets
    needs: [build, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      release-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      source-commit: ${{ steps.identity.outputs.source-commit }}
      version: ${{ steps.identity.outputs.version }}

    steps:
      - name: Check out the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.build.outputs.source-commit }}

      - name: Download the exact x86_64 release fragment
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.release-artifact-id }}
          path: ${{ runner.temp }}/release-inputs/x86_64

      - name: Download the exact verified ARM64 release fragment
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.arm64.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-inputs/aarch64

      - name: Verify fragment identity and aggregate canonical assets
        id: identity
        env:
          ARM_ARCHIVE_NAME: ${{ needs.arm64.outputs.archive_name }}
          ARM_ARCHIVE_SHA256: ${{ needs.arm64.outputs.archive_sha256 }}
          ARM_ARTIFACT_ID: ${{ needs.arm64.outputs.artifact_id }}
          ARM_CHECKSUM_NAME: ${{ needs.arm64.outputs.checksum_name }}
          ARM_SOURCE_COMMIT: ${{ needs.arm64.outputs.source_commit }}
          ARM_VERSION: ${{ needs.arm64.outputs.version }}
          X86_ARTIFACT_ID: ${{ needs.build.outputs.release-artifact-id }}
          X86_SOURCE_COMMIT: ${{ needs.build.outputs.source-commit }}
          X86_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$X86_ARTIFACT_ID"
          test -n "$ARM_ARTIFACT_ID"
          test "$X86_ARTIFACT_ID" != "$ARM_ARTIFACT_ID"
          test "$X86_SOURCE_COMMIT" = "$ARM_SOURCE_COMMIT"
          test "$X86_VERSION" = "$ARM_VERSION"
          test "$ARM_ARCHIVE_NAME" = \
            "notm-v${X86_VERSION}-aarch64-unknown-linux-gnu.tar.gz"
          test "$ARM_CHECKSUM_NAME" = SHA256SUMS-aarch64
          [[ "$ARM_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$X86_SOURCE_COMMIT"

          packaging/arm64/aggregate-release.sh \
            "$RUNNER_TEMP/release-inputs/x86_64" \
            "$RUNNER_TEMP/release-inputs/aarch64" \
            "$RUNNER_TEMP/release-aggregate" \
            "$X86_VERSION" \
            "$X86_SOURCE_COMMIT" \
            "$ARM_ARCHIVE_SHA256"

          printf 'source-commit=%s\n' "$X86_SOURCE_COMMIT" >>"$GITHUB_OUTPUT"
          printf 'version=%s\n' "$X86_VERSION" >>"$GITHUB_OUTPUT"

      - name: Upload the canonical release assets
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            ${{ runner.temp }}/release-aggregate/*.tar.gz
            ${{ runner.temp }}/release-aggregate/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  attest:
    name: Attest release assets
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # Mint a short-lived Sigstore signing identity.
      attestations: write # Store provenance in this repository.
      artifact-metadata: write # Record metadata for attested artifacts.

    steps:
      - name: Download release assets
        # v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.aggregate.outputs.release-artifact-id }}
          path: dist

      - name: Verify release assets
        env:
          VERSION: ${{ needs.aggregate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "notm-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            "notm-v${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
            "notm-v${VERSION}-src.tar.gz"
            SHA256SUMS
          )
          test "$(find dist -mindepth 1 -maxdepth 1 | wc -l)" -eq 4
          for artifact in "${expected[@]}"; do
            test -f "dist/$artifact"
            test ! -L "dist/$artifact"
          done
          test "$(wc -l <dist/SHA256SUMS)" -eq 3
          (cd dist && sha256sum --check --strict SHA256SUMS)

      - name: Attest build provenance
        # v4.2.2
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS

  publish:
    name: Publish release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [aggregate, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # Create the release and upload its assets.

    steps:
      - name: Download release assets
        # v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.aggregate.outputs.release-artifact-id }}
          path: dist

      - name: Verify release assets
        env:
          VERSION: ${{ needs.aggregate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "notm-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            "notm-v${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
            "notm-v${VERSION}-src.tar.gz"
            SHA256SUMS
          )
          test "$(find dist -mindepth 1 -maxdepth 1 | wc -l)" -eq 4
          for artifact in "${expected[@]}"; do
            test -f "dist/$artifact"
            test ! -L "dist/$artifact"
          done
          test "$(wc -l <dist/SHA256SUMS)" -eq 3
          (cd dist && sha256sum --check --strict SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.aggregate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'release already exists; refusing to replace it' >&2
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" \
            "dist/notm-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            "dist/notm-v${VERSION}-aarch64-unknown-linux-gnu.tar.gz" \
            "dist/notm-v${VERSION}-src.tar.gz" \
            dist/SHA256SUMS \
            --generate-notes \
            --latest \
            --repo "$GITHUB_REPOSITORY" \
            --title "notm ${VERSION}" \
            --verify-tag
