services:
  runner:
    build:
      context: .
      network: host
    image: notm-actions-runner:ubuntu24.04-rust1.97.1
    container_name: notm-actions-runner
    hostname: notm-runner-private-ci-host
    restart: unless-stopped
    init: true
    user: "1000:1000"
    working_dir: /home/ubuntu
    network_mode: host
    environment:
      HOME: /home/ubuntu
      LANG: C.UTF-8
      RUSTUP_HOME: /opt/rustup
      CARGO_HOME: /home/ubuntu/.cargo
      RUNNER_MANUALLY_TRAP_SIG: "1"
    volumes:
      - /home/user/.local/share/notm-actions-runner/home:/home/ubuntu
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,exec,size=8g
      - /var/tmp:rw,nosuid,nodev,size=4g
    shm_size: "2gb"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 4096
    cpus: 12.0
    mem_limit: 24g
    stop_grace_period: 2m
